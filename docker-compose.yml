# Sobe os dois bancos usados no trabalho:
#   docker compose up -d
#   docker compose down -v   (apaga tudo no final)
services:
  neo4j:
    image: neo4j:5
    container_name: neo4j-grafos
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # protocolo bolt (cypher-shell)
    environment:
      - NEO4J_AUTH=neo4j/senha123
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7
    container_name: redis-carrinho
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  neo4j_data:
  redis_data:
